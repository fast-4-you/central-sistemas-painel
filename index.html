<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Central de Sistemas fast4you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
  /* Opcional: preencha para o login já vir com o repositório certo */
  window.CENTRAL_REPO = { owner: "fast-4-you", repo: "central-sistemas", branch: "dados" };
</script>
<script src="github-shim.js"></script>
<style>
:root{
  --orange:#ff7700; --orange-ink:#c25700; --purple:#8F1C5A; --purple-deep:#5a0f38; --purple-soft:#f6e9f0;
  --bg:#f6f4f7; --panel:#ffffff; --fg:#241a22; --muted:#6d6170; --line:#e6dfe8; --line-strong:#cfc4d2;
  --ok:#17935f; --warn:#d99a00; --bad:#d23642; --info:#5b6bd1; --idle:#a593ab;
  --ok-bg:#e5f5ee; --warn-bg:#fff4d6; --bad-bg:#fde8ea; --info-bg:#eaedfb;
  --side-fg:#f7e9f1; --shadow:0 1px 0 rgba(36,26,34,.06);
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#161116; --panel:#211922; --fg:#f4edf3; --muted:#b3a5b5; --line:#352a37; --line-strong:#4a3c4d;
    --purple-soft:#3a1a2c; --purple-deep:#3d0a26; --orange-ink:#ff9a40;
    --ok:#3cc78a; --warn:#f2bd2c; --bad:#ff5c68; --info:#8e9bff; --idle:#7d6b82;
    --ok-bg:#16342a; --warn-bg:#3a2f0e; --bad-bg:#3d1a1e; --info-bg:#1f2448;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161116; --panel:#211922; --fg:#f4edf3; --muted:#b3a5b5; --line:#352a37; --line-strong:#4a3c4d;
  --purple-soft:#3a1a2c; --purple-deep:#3d0a26; --orange-ink:#ff9a40;
  --ok:#3cc78a; --warn:#f2bd2c; --bad:#ff5c68; --info:#8e9bff; --idle:#7d6b82;
  --ok-bg:#16342a; --warn-bg:#3a2f0e; --bad-bg:#3d1a1e; --info-bg:#1f2448;
  --shadow:none; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--purple)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) a{color:#e58fbd}}
:root[data-theme="dark"] a{color:#e58fbd}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--purple-deep);color:var(--side-fg);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-mark{width:36px;height:36px;border-radius:10px;background:var(--orange);display:grid;place-items:center;font-weight:800;color:#fff;font-stretch:80%;font-size:15px;letter-spacing:-.02em}
.brand-name{font-weight:800;font-size:18px;line-height:1;font-stretch:88%}
.brand-sub{font-size:12px;opacity:.75;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:8px;color:var(--side-fg);text-decoration:none;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.07)}
.nav a[aria-current="page"]{background:rgba(255,255,255,.12);box-shadow:inset 3px 0 0 var(--orange)}
.nav .count{background:var(--orange);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;min-width:24px;text-align:center}
.side-foot{margin-top:auto;font-size:12px;opacity:.8;padding:0 6px;display:flex;flex-direction:column;gap:8px}
.side-foot button{background:transparent;border:1px solid rgba(255,255,255,.25);color:var(--side-fg);border-radius:8px;padding:6px 8px;cursor:pointer;text-align:left}

.main{min-width:0;padding:22px clamp(14px,3vw,34px) 60px}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:clamp(24px,3vw,32px);font-stretch:85%;font-weight:800;letter-spacing:-.01em;margin:0;line-height:1.1}
.sub{color:var(--muted);margin:4px 0 0}
h2{font-size:17px;font-weight:700;margin:0 0 10px;font-stretch:92%}
h3{font-size:15px;margin:0 0 6px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line-strong);background:var(--panel);border-radius:9px;padding:8px 13px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--purple)}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.primary:hover{background:#ec6c00}
.btn.purple{background:var(--purple);border-color:var(--purple);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.small{padding:5px 9px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.stack{display:flex;flex-direction:column;gap:14px}

/* status wall: the signature element */
.wall-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.wall-big{font-size:clamp(40px,6vw,64px);font-weight:800;font-stretch:72%;line-height:.9;letter-spacing:-.02em}
.wall-big small{font-size:.36em;font-weight:600;font-stretch:100%;color:var(--muted);letter-spacing:0;margin-left:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:5px}
.tile{border:0;border-radius:7px;height:38px;cursor:pointer;color:#fff;font-weight:700;font-size:11.5px;font-stretch:78%;display:flex;align-items:flex-end;justify-content:flex-start;padding:4px 6px;position:relative}
.tile.on{background:var(--ok)} .tile.nosale{background:var(--warn);color:#2b2100} .tile.off{background:var(--bad)} .tile.impl{background:var(--idle)}
.tile.flag::after{content:"";position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.18)}
.tile:hover{filter:brightness(1.08)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.kpi:hover{border-color:var(--purple)}
.kpi .v{font-size:28px;font-weight:800;font-stretch:80%;line-height:1.05}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .d{font-size:12px;font-weight:600}
.kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)} .kpi.ok .v{color:var(--ok)}

.read{border-left:4px solid var(--orange);padding-left:14px}
.read ul{margin:6px 0 0;padding-left:18px}
.read li{margin:3px 0}
.ai-out{white-space:pre-wrap;background:var(--purple-soft);border-radius:10px;padding:12px;margin-top:10px;font-size:14px;display:none}
.ai-out.show{display:block}

.chartbox{position:relative;height:240px}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters input,.filters select,.field input,.field select,.field textarea{border:1px solid var(--line-strong);background:var(--panel);border-radius:8px;padding:7px 10px;min-width:0}
.filters input[type=search]{flex:1 1 220px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12.5px;color:var(--muted);font-weight:600;background:var(--bg);position:sticky;top:0}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--purple-soft)}
td.wrap{white-space:normal;min-width:220px}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-warn{background:var(--warn-bg);color:var(--warn)} .p-bad{background:var(--bad-bg);color:var(--bad)} .p-info{background:var(--info-bg);color:var(--info)} .p-idle{background:var(--line);color:var(--muted)} .p-brand{background:var(--purple-soft);color:var(--purple)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .p-brand{color:#f0a6cd}}
:root[data-theme="dark"] .p-brand{color:#f0a6cd}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.empty{padding:28px;text-align:center;color:var(--muted)}

.alert{display:grid;grid-template-columns:6px 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px 10px 0;overflow:hidden}
.alert .bar{align-self:stretch;border-radius:0 4px 4px 0}
.alert.crit .bar{background:var(--bad)} .alert.high .bar{background:var(--orange)} .alert.warn .bar{background:var(--warn)} .alert.info .bar{background:var(--info)}
.alert .t{font-weight:600}
.alert .m{font-size:13px;color:var(--muted)}

.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn-bg);border:1px solid var(--warn);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:14px}
.banner.err{background:var(--bad-bg);border-color:var(--bad)}

.tip{display:flex;flex-direction:column;gap:6px}
.tip .meta{font-size:12.5px;color:var(--muted)}

.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:10px}
.steps li::before{content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--purple);color:#fff;display:grid;place-items:center;font-weight:700}
.integ{display:flex;flex-direction:column;gap:8px}
.integ code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 5px;word-break:break-all}
.integ ul{margin:0;padding-left:18px}
.integ li{margin:3px 0}
details.integ summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:8px;align-items:center}
details.integ summary::-webkit-details-marker{display:none}
details.integ[open] summary{margin-bottom:6px}
.arch{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:stretch}
.arch div{border:1px dashed var(--line-strong);border-radius:10px;padding:10px;font-size:13px}
.arch b{display:block;margin-bottom:3px}

/* modal + drawer */
.scrim{position:fixed;inset:0;background:rgba(20,8,16,.45);display:none;z-index:40}
.scrim.show{display:block}
.modal{position:fixed;z-index:50;left:50%;top:50%;transform:translate(-50%,-50%);width:min(720px,94vw);max-height:88vh;overflow:auto;background:var(--panel);border-radius:16px;padding:20px;display:none;border:1px solid var(--line)}
.modal.show{display:block}
.drawer{position:fixed;z-index:50;top:0;right:0;height:100%;width:min(480px,96vw);background:var(--panel);border-left:1px solid var(--line);padding:calc(20px + env(safe-area-inset-top,0px)) 20px 20px;overflow:auto;transform:translateX(105%);transition:transform .22s ease}
.drawer.show{transform:none}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.field.full{grid-column:1/-1}
.field input,.field select,.field textarea{color:var(--fg);font-size:14px}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--fg)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}

.toast{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--purple-deep);color:#fff;border-radius:12px;padding:12px 14px;max-width:360px;display:none;gap:10px;align-items:flex-start;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.show{display:flex}
.toast b{color:#ffb070}
.toast button{background:var(--orange);color:#fff;border:0;border-radius:8px;padding:5px 10px;font-weight:600;cursor:pointer}

.mobilebar{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:250px;z-index:45;transform:translateX(-105%);transition:transform .2s;height:100%;padding-top:calc(20px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .mobilebar{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--purple-deep);color:#fff;padding:10px 14px}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--purple-deep)}
  .mobilebar button{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:5px 10px}
  .kv{grid-template-columns:1fr}
}
.muted{color:var(--muted)} .small{font-size:13px}
h2.sec{font-size:13.5px;color:var(--muted);font-weight:600;margin:4px 0 8px}
.fila{display:flex;flex-direction:column}
.fila-it{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 2px;cursor:pointer}
.fila-it:last-child{border-bottom:0}
.fila-it:hover{background:var(--purple-soft)}
.okr{display:flex;flex-direction:column;gap:8px}
.okr-row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:6px 0}
.meter{position:relative;height:10px;border-radius:99px;background:var(--line);overflow:visible}
.meter span{display:block;height:100%;border-radius:99px}
.meter i{position:absolute;top:-4px;width:2px;height:18px;background:var(--fg)}
.help{font-size:12.5px;color:var(--muted);background:var(--bg);border-radius:8px;padding:8px 10px;border:1px solid var(--line)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.card-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.score{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13.5px;margin:10px 0}
.score span{color:var(--muted)}
.score b.bad{color:var(--bad)} .score b.warn{color:var(--warn)}
.qa{display:flex;flex-direction:column;gap:10px}
.qa-it{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:8px}
.qa-it select{border:1px solid var(--line-strong);background:var(--panel);border-radius:8px;padding:5px 8px}
.matrix td{white-space:normal;vertical-align:top}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="mobilebar"><button id="menuBtn" aria-label="Abrir menu">Menu</button><b>fast4you</b><span class="small" style="opacity:.8">Central de Sistemas</span></div>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><div class="brand-mark">f4y</div><div><div class="brand-name">fast4you</div><div class="brand-sub">Central de Sistemas</div></div></div>
    <nav class="nav" id="nav">
      <a href="#painel">Painel da rede</a>
      <a href="#chamados">Fila de chamados <span class="count" id="navChamados" hidden></span></a>
      <a href="#pdvs">Unidades e PDVs</a>
      <a href="#problemas">Problemas recorrentes <span class="count" id="navProb" hidden></span></a>
      <a href="#fornecedores">Fornecedores e SLAs</a>
      <a href="#conhecimento">Base de conhecimento</a>
      <a href="#semanal">Relatório de segunda</a>
      <a href="#alertas">Alertas <span class="count" id="navAlertas" hidden></span></a>
      <a href="#novidades">Novidades e dicas</a>
      <a href="#integracoes">Integrações e APIs</a>
    </nav>
    <div class="side-foot">
      <span id="syncInfo">Conectando…</span>
      <button id="themeBtn" type="button">Alternar tema</button>
      <button id="sairBtn" type="button" onclick="window.centralGithub&&window.centralGithub.sair()">Sair</button>
    </div>
  </aside>
  <main class="main" id="main" tabindex="-1"></main>
</div>
<div class="scrim" id="scrim"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true"></div>
<aside class="drawer" id="drawer" aria-label="Detalhes"></aside>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="fileInput" accept=".xlsx,.xls,.csv" hidden>

<script>
(function(){
"use strict";
/* ---------- constantes ---------- */
const STATUS_PDV = {ativo:"Ativo",implantacao:"Em implantação",repasse:"Repasse",distrato:"Distrato",cancelado:"Cancelado"};
const ORIGENS = ["Sults","WhatsApp","E-mail","Teams","Planilha fornecedor"];
const FORNECEDORES = ["Soft-line/Infinity","Beepay","Preditta","PagBank","Santander","Interno"];
const CATEGORIAS = ["PDV sem vendas","PDV offline","Facial","App F4Y","Trava","Certificado digital","Pagamento/POS","Câmeras/Audit","Equipamento/Infra","Outro"];
const CRITICAS = ["PDV sem vendas","PDV offline","Facial","App F4Y"];
const PRIOR = {critica:"P1 Crítica",alta:"P2 Alta",media:"P3 Média",baixa:"P4 Baixa"};
const PCODE = {critica:"P1",alta:"P2",media:"P3",baixa:"P4"};
const PRIOR_HELP = {critica:"Loja sem conseguir vender ou falha grave de acesso/segurança. Plantão imediato, responsável definido e acompanhamento até o contorno.",
  alta:"Falha em função importante com operação parcial. Atendimento prioritário e prazo específico.",
  media:"Divergência em relatório, NF ou estoque sem paralisação. Fila normal com prazo.",
  baixa:"Dúvidas, solicitações administrativas, melhorias e treinamentos. Atendimento programado."};
const ST_CH = {aberto:"Aberto",andamento:"Em diagnóstico",fornecedor:"Aguardando fornecedor",contorno:"Contornado (operando)",validacao:"Aguardando validação",resolvido:"Resolvido"};
const ST_PROB = {investigando:"Investigando",causa:"Causa identificada",plano:"Plano em execução",validando:"Validando solução",resolvido:"Resolvido"};
const DEF_CONFIG = {horasSemVenda:24, diasCertAviso:30, horasSLACritico:24, recorrenciaMin:3, time:"Coordenação, Alice, Augusto", okrBaseCriticos:0, okrReducao:20};
const DEF_FORN = {
  "Soft-line/Infinity":{escopo:"Infraestrutura sistêmica das unidades, ERP (SacVarejo/Infinity), PDV, roteador, totem, leitor, trava, certificado no ERP.",reuniao:"Semanal"},
  "Beepay":{escopo:"App F4Y para clientes, painel do franqueado, facial e pagamento pelo app.",reuniao:"Quinzenal"},
  "Preditta":{escopo:"Ferramenta Audit de auditoria pelas câmeras dos PDVs.",reuniao:""},
  "PagBank":{escopo:"Adquirente principal, POS em comodato, liquidação e conciliação.",reuniao:"Quinzenal"},
  "Santander":{escopo:"Adquirente secundária (POS e conciliação).",reuniao:""},
  "Interno":{escopo:"Demandas resolvidas pelo próprio time de Sistemas fast4you.",reuniao:""}};

const S = {db:null,user:null,dl:null,sample:null,canWrite:false,ready:false,
  pdvs:[],chamados:[],dicas:[],snaps:[],problemas:[],forn:[],procs:[],config:{...DEF_CONFIG},
  loaded:{pdvs:false,chamados:false,dicas:false,snaps:false,config:false,problemas:false,forn:false,procs:false},
  error:null, charts:[], snapWritten:false, toastShown:false,
  f:{pdv:{q:"",status:"",online:"",trava:"",cert:""}, ch:{q:"",status:"abertos",prioridade:"",origem:"",fornecedor:"",categoria:"",dono:""}},
  semanaIni:null, importCtx:null};

/* ---------- utilidades ---------- */
const $ = s=>document.querySelector(s);
const esc = v => String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const now = ()=>new Date();
const hoursSince = iso => iso? (now()-new Date(iso))/36e5 : Infinity;
const daysUntil = d => d? Math.floor((new Date(d+"T23:59:59")-now())/864e5) : null;
const fmtDT = iso => { if(!iso) return "—"; const d=new Date(iso); if(isNaN(d)) return "—"; return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})+" "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}); };
const fmtD = s => { if(!s) return "—"; const d=new Date(s.length<=10? s+"T12:00:00": s); return isNaN(d)?"—":d.toLocaleDateString("pt-BR"); };
const ago = iso => { const h=hoursSince(iso); if(!isFinite(h)) return "sem registro"; if(h<1) return Math.max(1,Math.round(h*60))+" min"; if(h<48) return Math.round(h)+" h"; return Math.round(h/24)+" dias"; };
const pct = (a,b)=> b? Math.round(a/b*100) : 0;
const norm = s => String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
const isoDay = d => { const x=new Date(d); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); };
const slug = s => norm(s).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,120) || ("id-"+Date.now());
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

/* ---------- regras de negócio ---------- */
function pdvState(p){
  if(p.status!=="ativo") return "impl";
  if(!p.online) return "off";
  if(hoursSince(p.ultimaVenda) > S.config.horasSemVenda) return "nosale";
  return "on";
}
function certState(p){
  const d = daysUntil(p.certValidade);
  if(d===null) return "sem";
  if(d<0) return "vencido";
  if(d<=S.config.diasCertAviso) return "avencer";
  return "ok";
}
const abertos = () => S.chamados.filter(c=>c.status!=="resolvido");
const pdvByCode = code => S.pdvs.find(p=>String(p.codigo)===String(code));
const pdvLabel = code => { const p=pdvByCode(code); return p? p.codigo+" "+p.unidade : (code||"—"); };

function metrics(){
  const P=S.pdvs, ativos=P.filter(p=>p.status==="ativo");
  const st = ativos.map(pdvState);
  const m = {
    total:P.length, ativos:ativos.length,
    online: st.filter(s=>s==="on"||s==="nosale").length,
    onVenda: st.filter(s=>s==="on").length,
    semVenda: st.filter(s=>s==="nosale").length,
    offline: st.filter(s=>s==="off").length,
    implantacao:P.filter(p=>p.status==="implantacao").length,
    repasse:P.filter(p=>p.status==="repasse").length,
    distrato:P.filter(p=>p.status==="distrato").length,
    cancelado:P.filter(p=>p.status==="cancelado").length,
    franqueados:new Set(ativos.map(p=>norm(p.franqueado)).filter(Boolean)).size,
    travaCerv:ativos.filter(p=>p.travaCervejeira).length,
    travaPorta:ativos.filter(p=>p.travaPorta).length,
    certVenc:ativos.filter(p=>certState(p)==="vencido").length,
    certAvencer:ativos.filter(p=>certState(p)==="avencer").length,
    facialFalha:ativos.filter(p=>p.facialOk===false).length,
    appFalha:ativos.filter(p=>p.appOk===false).length,
    auditFalha:ativos.filter(p=>p.auditOk===false).length
  };
  const A=abertos();
  m.chAbertos=A.length;
  m.chCriticos=A.filter(c=>c.prioridade==="critica").length;
  m.chWhats=A.filter(c=>c.origem==="WhatsApp").length;
  m.chSemProtocolo=A.filter(c=>c.origem==="WhatsApp" && !c.protocolo).length;
  const res=S.chamados.filter(c=>c.status==="resolvido"&&c.resolvidoEm&&c.abertoEm&&hoursSince(c.resolvidoEm)<24*30);
  m.slaMedio = res.length? res.reduce((s,c)=>s+(new Date(c.resolvidoEm)-new Date(c.abertoEm))/36e5,0)/res.length : null;
  m.recorrencias = recorrencias(now(),30).length;
  m.aguardForn = A.filter(c=>c.status==="fornecedor").length;
  m.pendVencidas = A.filter(c=>c.proximoRetorno && new Date(c.proximoRetorno)<now()).length;
  m.semDono = A.filter(c=>!donoDe(c)).length;
  m.reabertos30 = S.chamados.filter(c=>(c.reaberturas||0)>0 && hoursSince(c.abertoEm)<24*30).length;
  m.probAbertos = S.problemas.filter(p=>p.status!=="resolvido").length;
  m.probSemCausa = S.problemas.filter(p=>p.status!=="resolvido" && !String(p.causaRaiz||"").trim()).length;
  const p1=S.chamados.filter(c=>c.prioridade==="critica"&&hoursSince(c.abertoEm)<24*30&&(c.contornoEm||c.resolvidoEm));
  m.recP1 = p1.length? p1.reduce((s,c)=>s+(new Date(c.contornoEm||c.resolvidoEm)-new Date(c.abertoEm))/36e5,0)/p1.length : null;
  const fr=S.chamados.filter(c=>c.primeiraRespostaEm&&hoursSince(c.abertoEm)<24*30);
  m.primResp = fr.length? fr.reduce((s,c)=>s+(new Date(c.primeiraRespostaEm)-new Date(c.abertoEm))/36e5,0)/fr.length : null;
  m.crit30 = S.chamados.filter(c=>c.prioridade==="critica"&&hoursSince(c.abertoEm)<24*30).length;
  const c30=S.chamados.filter(c=>hoursSince(c.abertoEm)<24*30), recIds=new Set(); recorrencias(now(),30).forEach(r=>r.ultimos.forEach(c=>recIds.add(c.id)));
  m.reincidPct = c30.length? Math.round(c30.filter(c=>recIds.has(c.id)||c.problemaId).length/c30.length*100) : 0;
  return m;
}
const timeList = () => String(S.config.time||"").split(",").map(s=>s.trim()).filter(Boolean);
const donoDe = c => c.dono || c.responsavel || "";
const fmtH = h => h==null? "—" : (h<1? Math.max(1,Math.round(h*60))+" min" : h<48? Math.round(h)+" h" : Math.round(h/24)+" d");
function fornInfo(nome){ const d=S.forn.find(f=>f.nome===nome)||{}; return Object.assign({nome},DEF_FORN[nome]||{},d); }
function incidentesGerais(){
  const map={}; S.chamados.filter(c=>hoursSince(c.abertoEm)<24 && c.pdv).forEach(c=>{ const k=c.categoria+"|"+c.fornecedor; (map[k]=map[k]||new Set()).add(c.pdv); });
  return Object.entries(map).filter(([,s])=>s.size>=3).map(([k,s])=>{const [cat,f]=k.split("|"); return {categoria:cat,fornecedor:f,pdvs:[...s]};});
}
function recorrencias(ate, dias){
  const ini = new Date(ate - dias*864e5), map={};
  S.chamados.forEach(c=>{ const d=new Date(c.abertoEm); if(!(d>=ini&&d<=ate)||!c.pdv) return; const k=c.pdv+"|"+c.categoria; (map[k]=map[k]||[]).push(c); });
  return Object.entries(map).filter(([,v])=>v.length>=S.config.recorrenciaMin).map(([k,v])=>{const [pdv,cat]=k.split("|");return {pdv,categoria:cat,qtd:v.length,ultimos:v,vinculado:v.every(c=>c.problemaId)}}).sort((a,b)=>b.qtd-a.qtd);
}
function computeAlerts(){
  const out=[], cfg=S.config;
  S.pdvs.filter(p=>p.status==="ativo").forEach(p=>{
    const s=pdvState(p), lbl=p.codigo+" "+p.unidade;
    if(s==="off") out.push({sev:"crit",t:"PDV offline: "+lbl,m:"Último sinal há "+ago(p.ultimoPing)+". Franqueado "+(p.franqueado||"—")+".",pdv:p.codigo});
    else if(s==="nosale") out.push({sev:"high",t:"PDV sem vendas: "+lbl,m:"Online, mas sem venda há "+ago(p.ultimaVenda)+" (limite "+cfg.horasSemVenda+" h).",pdv:p.codigo});
    const c=certState(p), d=daysUntil(p.certValidade);
    if(c==="vencido") out.push({sev:"crit",t:"Certificado digital vencido: "+lbl,m:"Venceu em "+fmtD(p.certValidade)+". Emissão fiscal pode estar parada.",pdv:p.codigo});
    else if(c==="avencer") out.push({sev:"warn",t:"Certificado vence em "+d+" dias: "+lbl,m:"Validade "+fmtD(p.certValidade)+". Agende a renovação com o franqueado.",pdv:p.codigo});
    if(p.facialOk===false) out.push({sev:"high",t:"Falha no acesso por facial: "+lbl,m:"Clientes podem não conseguir entrar.",pdv:p.codigo});
    if(p.appOk===false) out.push({sev:"high",t:"Falha no app F4Y: "+lbl,m:"Clientes podem não conseguir comprar pelo app.",pdv:p.codigo});
    if(p.auditOk===false) out.push({sev:"warn",t:"Câmeras/Audit com falha: "+lbl,m:"Auditoria Preditta sem imagem.",pdv:p.codigo});
    if(!p.travaCervejeira||!p.travaPorta) out.push({sev:"info",t:"Trava pendente: "+lbl,m:[!p.travaCervejeira?"cervejeira":null,!p.travaPorta?"porta de entrada":null].filter(Boolean).join(" e ")+" sem trava instalada.",pdv:p.codigo});
  });
  abertos().forEach(c=>{
    if(c.prioridade==="critica" && hoursSince(c.abertoEm)>cfg.horasSLACritico) out.push({sev:"crit",t:"Chamado crítico aberto há "+ago(c.abertoEm),m:c.titulo+" | "+pdvLabel(c.pdv)+" | "+c.fornecedor,ch:c.id});
    if(c.proximoRetorno && new Date(c.proximoRetorno)<now()) out.push({sev:"high",t:"Retorno vencido: "+c.titulo,m:"Combinado para "+fmtDT(c.proximoRetorno)+" com "+c.fornecedor+". Próxima ação: "+(c.proximaAcao||"não definida")+". Dono: "+(donoDe(c)||"sem dono")+".",ch:c.id});
    if(!donoDe(c) && (c.prioridade==="critica"||c.prioridade==="alta")) out.push({sev:"high",t:"Chamado "+PCODE[c.prioridade]+" sem dono na fast4you",m:c.titulo+" | defina quem acompanha, mesmo aguardando fornecedor.",ch:c.id});
    const fi=fornInfo(c.fornecedor);
    if(c.prioridade==="critica" && !c.primeiraRespostaEm && fi.slaRespostaP1 && hoursSince(c.abertoEm)*60>Number(fi.slaRespostaP1)) out.push({sev:"crit",t:"SLA de resposta P1 estourado: "+c.fornecedor,m:c.titulo+" | sem resposta há "+ago(c.abertoEm)+". Escalonar para: "+(fi.nivel2||"nível 2 não cadastrado")+".",ch:c.id});
    if(c.origem==="WhatsApp" && !c.protocolo) out.push({sev:"info",t:"Chamado do WhatsApp sem protocolo",m:c.titulo+" | registre o protocolo do Sults ou do fornecedor para não perder a rastreabilidade.",ch:c.id});
  });
  recorrencias(now(),30).forEach(r=>{ if(r.vinculado) return; out.push({sev:"warn",t:"Reincidência sem problema aberto: "+pdvLabel(r.pdv),m:r.qtd+" chamados de "+r.categoria+" em 30 dias. Abra um problema para investigar a causa raiz.",pdv:r.pdv,rec:r.pdv+"|"+r.categoria}); });
  incidentesGerais().forEach(i=>out.push({sev:"crit",t:"Possível instabilidade geral: "+i.categoria+" ("+i.fornecedor+")",m:i.pdvs.length+" unidades com o mesmo tipo de falha nas últimas 24 h: "+i.pdvs.join(", ")+".",go:"problemas"}));
  S.problemas.filter(p=>p.status!=="resolvido"&&p.prazo&&daysUntil(p.prazo)<0).forEach(p=>out.push({sev:"high",t:"Plano de ação vencido: "+p.titulo,m:"Prazo era "+fmtD(p.prazo)+". Cobrar "+(p.fornecedor||"fornecedor")+".",prob:p.id}));
  if(now().getDay()===1) out.push({sev:"info",t:"Hoje é segunda: relatório semanal",m:"Abra o Relatório de segunda e exporte para a reunião.",go:"semanal"});
  const ord={crit:0,high:1,warn:2,info:3};
  return out.sort((a,b)=>ord[a.sev]-ord[b.sev]);
}

/* ---------- inicialização ---------- */
async function init(){
  route();
  if(!window.claude || typeof window.claude.use!=="function"){ S.error="offline"; renderAll(); return; }
  const [db,user,dl,sample] = await Promise.all([claude.use("db"),claude.use("user"),claude.use("downloads"),claude.use("sample")]);
  S.db=db; S.user=user; S.dl=dl; S.sample=sample;
  if(!db){ S.error="nodb"; renderAll(); return; }
  let can=null; try{ can = user? await user.can("data.write") : null; }catch(e){}
  S.canWrite = can!==false;
  const timer=setTimeout(()=>{ if(!S.loaded.pdvs||!S.loaded.chamados){ S.error="slow"; renderAll(); } },10000);
  const sub=(path,key,map)=>db.collection(path).onSnapshot(snap=>{
    S[key]=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
    if(map) map();
    if(!snap.metadata.fromCache){ S.loaded[key]=true; }
    if(S.loaded.pdvs&&S.loaded.chamados){ clearTimeout(timer); if(S.error==="slow") S.error=null; }
    S.ready=true; renderAll(); maybeSnapshot(); maybeToast();
  },err=>{ S.error="db:"+err.code; renderAll(); });
  sub("pdvs","pdvs"); sub("chamados","chamados"); sub("dicas","dicas"); sub("snapshots","snaps"); sub("problemas","problemas"); sub("fornecedores","forn"); sub("procedimentos","procs");
  db.doc("config/integracoes").onSnapshot(d=>{ S.integ=d.exists?d.data():{}; if(S.page==="integracoes") renderMain(); },()=>{});
  db.doc("config/geral").onSnapshot(d=>{ S.config=Object.assign({},DEF_CONFIG,d.exists?d.data():{}); S.loaded.config=true; renderAll(); },()=>{});
}
async function maybeSnapshot(){
  if(S.snapWritten||!S.canWrite||!S.loaded.pdvs||!S.loaded.chamados||!S.loaded.snaps||!S.pdvs.length) return;
  const day=isoDay(now()); if(S.snaps.some(s=>s.id===day)){ S.snapWritten=true; return; }
  S.snapWritten=true; const m=metrics();
  try{ await S.db.doc("snapshots/"+day).set({dia:day,ativos:m.ativos,online:m.online,semVenda:m.semVenda,offline:m.offline,chAbertos:m.chAbertos,chCriticos:m.chCriticos,certVenc:m.certVenc,gravadoEm:now().toISOString()}); }catch(e){}
}
function maybeToast(){
  if(S.toastShown||!S.loaded.pdvs||!S.loaded.chamados) return;
  S.toastShown=true;
  const al=computeAlerts(), crit=al.filter(a=>a.sev==="crit").length, high=al.filter(a=>a.sev==="high").length;
  if(!crit&&!high) return;
  const t=$("#toast");
  t.innerHTML='<div><b>'+crit+' alertas críticos</b> e '+high+' de alta prioridade na rede agora.</div><button type="button" data-act="toast-go">Ver</button>';
  t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),12000);
}

/* ---------- roteamento ---------- */
const PAGES=["painel","pdvs","chamados","problemas","fornecedores","conhecimento","semanal","alertas","novidades","integracoes"];
function route(){
  const h=(location.hash||"").slice(1); const p=PAGES.includes(h)?h:"painel";
  document.querySelectorAll("#nav a").forEach(a=>a.setAttribute("aria-current", a.getAttribute("href")==="#"+p?"page":"false"));
  S.page=p; $("#side").classList.remove("open"); renderMain(); $("#main").scrollTop=0;
}
window.addEventListener("hashchange",route);

function renderAll(){ renderNav(); renderMain(); }
function renderNav(){
  const al=computeAlerts().filter(a=>a.sev==="crit"||a.sev==="high").length;
  const ca=abertos().filter(c=>c.prioridade==="critica").length;
  const n1=$("#navAlertas"), n2=$("#navChamados");
  n1.hidden=!al; n1.textContent=al; n2.hidden=!ca; n2.textContent=ca; n2.title="Chamados P1 abertos";
  const pa=S.problemas.filter(p=>p.status!=="resolvido").length, n3=$("#navProb"); n3.hidden=!pa; n3.textContent=pa;
  $("#syncInfo").textContent = S.error==="offline"?"Abra no Claude para ver os dados" : S.ready? ("Atualizado "+new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})+(S.canWrite?"":" (somente leitura)")) : "Conectando…";
}
function banners(){
  let h="";
  if(S.error==="offline") h+='<div class="banner err">Esta página precisa ser aberta no Claude para carregar e salvar os dados do time.</div>';
  else if(S.error==="nodb") h+='<div class="banner err">Entre na sua conta para acessar os dados compartilhados do time.</div>';
  else if(S.error==="slow") h+='<div class="banner">Os dados ainda não carregaram. Verifique sua conexão; a página continua tentando.</div>';
  else if(S.error&&S.error.startsWith("db:")) h+='<div class="banner err">Não foi possível ler os dados ('+esc(S.error.slice(3))+'). Recarregue a página.</div>';
  const demo=S.pdvs.some(p=>p.demo)||S.chamados.some(c=>c.demo)||S.problemas.some(x=>x.demo);
  if(demo) h+='<div class="banner"><span>Você está vendo <b>dados de exemplo</b> para conhecer o sistema. Importe suas planilhas ou cadastre os PDVs reais e depois remova os exemplos.</span>'+(S.canWrite?'<button class="btn small" data-act="clear-demo">Remover dados de exemplo</button>':'')+'</div>';
  return h;
}
function destroyCharts(){ S.charts.forEach(c=>{try{c.destroy()}catch(e){}}); S.charts=[]; }
function renderMain(){
  destroyCharts();
  const el=$("#main"); const fn={painel:pPainel,pdvs:pPdvs,chamados:pChamados,problemas:pProblemas,fornecedores:pFornecedores,conhecimento:pConhecimento,semanal:pSemanal,alertas:pAlertas,novidades:pNovidades,integracoes:pIntegracoes}[S.page];
  el.innerHTML = banners() + fn();
  if(S.page==="painel") drawPainelCharts();
  if(S.page==="semanal") drawSemanaCharts();
}

/* ---------- PAINEL ---------- */
function pPainel(){
  const m=metrics(), P=S.pdvs.filter(p=>p.status==="ativo"||p.status==="implantacao");
  P.sort((a,b)=>{const o={off:0,nosale:1,on:2,impl:3};return o[pdvState(a)]-o[pdvState(b)]||String(a.codigo).localeCompare(String(b.codigo),undefined,{numeric:true})});
  const hoje=now().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});
  const tiles = P.map(p=>{const s=pdvState(p); const flag=certState(p)==="vencido"||p.facialOk===false||p.appOk===false;
    const lab={on:"vendendo",nosale:"sem vendas",off:"offline",impl:"em implantação"}[s];
    return '<button class="tile '+s+(flag?' flag':'')+'" data-act="pdv" data-id="'+esc(p.codigo)+'" title="'+esc(p.codigo+" "+p.unidade+" | "+lab)+'" aria-label="'+esc(p.unidade+", "+lab)+'">'+esc(p.codigo)+'</button>';}).join("");
  const k=(v,l,d,cls,go)=>'<button class="kpi '+(cls||"")+'" data-go="'+(go||"")+'"><span class="v">'+v+'</span><span class="l">'+l+'</span>'+(d?'<span class="d muted">'+d+'</span>':'')+'</button>';
  const leitura = leituraDoDia(m);
  return `
  <div class="topbar"><div><h1>Painel da rede</h1><p class="sub">${esc(hoje.charAt(0).toUpperCase()+hoje.slice(1))}</p></div>
    <div class="row"><button class="btn" data-act="export-painel">Exportar indicadores</button>${S.canWrite?'<button class="btn primary" data-act="new-ch">Registrar chamado</button>':''}</div></div>
  <section class="panel" style="margin-bottom:14px">
    <div class="wall-head">
      <div><div class="wall-big">${m.ativos?pct(m.onVenda,m.ativos):0}%<small>dos PDVs ativos vendendo normalmente</small></div></div>
      <div class="legend"><span><i style="background:var(--ok)"></i>Vendendo (${m.onVenda})</span><span><i style="background:var(--warn)"></i>Online sem vendas há +${S.config.horasSemVenda} h (${m.semVenda})</span><span><i style="background:var(--bad)"></i>Offline (${m.offline})</span><span><i style="background:var(--idle)"></i>Em implantação (${m.implantacao})</span><span><i style="background:transparent;border:2px solid var(--muted);border-radius:50%"></i>Certificado vencido, facial ou app com falha</span></div>
    </div>
    ${P.length?'<div class="wall">'+tiles+'</div>':'<div class="empty">Nenhum PDV cadastrado ainda. <a href="#pdvs">Cadastre ou importe seus PDVs</a>.</div>'}
  </section>
  <h2 class="sec">A rede</h2>
  <div class="kpis" style="margin-bottom:18px">
    ${k(m.ativos,"PDVs ativos",m.franqueados+" franqueados com PDV","","pdvs")}
    ${k(m.offline,"PDVs offline","",m.offline?"bad":"ok","alertas")}
    ${k(m.semVenda,"Sem vendas",'há mais de '+S.config.horasSemVenda+' h',m.semVenda?"warn":"ok","alertas")}
    ${k(m.certVenc,"Certificados vencidos",m.certAvencer+" vencem em até "+S.config.diasCertAviso+" dias",m.certVenc?"bad":(m.certAvencer?"warn":"ok"),"pdvs")}
    ${k(pct(m.travaCerv,m.ativos)+"%","Trava na cervejeira",m.travaCerv+" de "+m.ativos+" PDVs","","pdvs")}
    ${k(pct(m.travaPorta,m.ativos)+"%","Trava na porta de entrada",m.travaPorta+" de "+m.ativos+" PDVs","","pdvs")}
    ${k(m.facialFalha+m.appFalha,"Facial ou app com falha",m.facialFalha+" facial, "+m.appFalha+" app",(m.facialFalha+m.appFalha)?"warn":"ok","alertas")}
    ${k(m.implantacao,"Em implantação","","","pdvs")}
    ${k(m.repasse+m.distrato+m.cancelado,"Repasse, distrato e cancelamento",m.repasse+" repasse, "+m.distrato+" distrato, "+m.cancelado+" cancel.","","pdvs")}
  </div>

function filaTop(){
  const o={critica:0,alta:1,media:2,baixa:3};
  const A=abertos().sort((a,b)=>o[a.prioridade]-o[b.prioridade]||String(a.abertoEm).localeCompare(String(b.abertoEm))).slice(0,6);
  if(!A.length) return '<p class="muted">Nenhum chamado em aberto.</p>';
  return '<div class="fila">'+A.map(c=>{const venc=c.proximoRetorno&&new Date(c.proximoRetorno)<now();
    return `<button class="fila-it" data-act="ch" data-id="${esc(c.id)}"><span><b>${esc(pdvLabel(c.pdv))}</b>: ${esc(c.titulo)}<span class="small muted" style="display:block">${esc(c.fornecedor)} | ${esc(ST_CH[c.status]||c.status)} | dono: ${esc(donoDe(c)||"sem dono")}${c.proximoRetorno?' | retorno '+(venc?'<b style="color:var(--bad)">vencido</b>':fmtDT(c.proximoRetorno)):''}</span></span>${prPill(c.prioridade)}</button>`;}).join("")+'</div>';
}
function okrHtml(m){
  const base=Number(S.config.okrBaseCriticos)||0, red=Number(S.config.okrReducao)||20, meta=base?Math.round(base*(1-red/100)):null;
  const atual=m.crit30, ok=meta!=null&&atual<=meta;
  const bar=meta!=null? Math.min(100,Math.round(atual/base*100)) : 0;
  return `<h2>Metas do setor (OKR)</h2>
  <div class="okr"><div class="okr-row"><span>Reduzir ${red}% dos chamados críticos</span><b>${meta==null?"defina a base":atual+" de no máximo "+meta}</b></div>
  ${meta!=null?`<div class="meter"><span style="width:${bar}%;background:${ok?"var(--ok)":"var(--orange)"}"></span><i style="left:${100-red}%"></i></div><p class="small muted">P1 dos últimos 30 dias contra a base de ${base}/mês. A marca mostra a meta.</p>`:'<p class="small muted">Informe a média mensal de críticos antes do projeto em Alertas, Regras.</p>'}
  <div class="okr-row"><span>Reincidência</span><b>${m.reincidPct}%</b></div>
  <div class="okr-row"><span>Tempo para restabelecer a operação (P1)</span><b>${fmtH(m.recP1)}</b></div>
  <div class="okr-row"><span>Chamados com retorno em dia</span><b>${m.chAbertos?pct(m.chAbertos-m.pendVencidas,m.chAbertos):100}%</b></div></div>`;
}
function leituraDoDia(m){
  const it=[];
  if(!S.pdvs.length) return '<p class="muted">Cadastre PDVs para ver a leitura automática da rede.</p>';
  it.push(m.offline? `<b>${m.offline} PDV${m.offline>1?"s":""} offline</b> agora; priorize contato com Soft-line/Infinity para infraestrutura.` : "Nenhum PDV ativo offline neste momento.");
  if(m.semVenda) it.push(`${m.semVenda} PDV${m.semVenda>1?"s estão":" está"} online sem vender há mais de ${S.config.horasSemVenda} h; confira POS (PagBank/Santander), app e facial.`);
  if(m.certVenc) it.push(`${m.certVenc} certificado${m.certVenc>1?"s":""} digital vencido${m.certVenc>1?"s":""}: risco de parar emissão fiscal.`);
  if(m.certAvencer) it.push(`${m.certAvencer} certificado${m.certAvencer>1?"s vencem":" vence"} nos próximos ${S.config.diasCertAviso} dias.`);
  const porF={}; abertos().forEach(c=>porF[c.fornecedor]=(porF[c.fornecedor]||0)+1);
  const topF=Object.entries(porF).sort((a,b)=>b[1]-a[1])[0];
  if(topF) it.push(`Fornecedor com mais chamados abertos: <b>${esc(topF[0])}</b> (${topF[1]}).`);
  const rec=recorrencias(now(),30)[0];
  if(rec) it.push(`Maior recorrência: ${esc(pdvLabel(rec.pdv))} com ${rec.qtd} chamados de ${esc(rec.categoria)} em 30 dias.`);
  if(m.pendVencidas) it.push(`<b>${m.pendVencidas} pendência${m.pendVencidas>1?"s":""} vencida${m.pendVencidas>1?"s":""}</b>: o fornecedor não retornou no prazo combinado. Cobre ou escalone.`);
  const inc=incidentesGerais()[0]; if(inc) it.push(`Possível instabilidade geral de ${esc(inc.categoria)} (${esc(inc.fornecedor)}) em ${inc.pdvs.length} unidades nas últimas 24 h.`);
  if(m.chSemProtocolo) it.push(`${m.chSemProtocolo} chamado${m.chSemProtocolo>1?"s":""} vindo${m.chSemProtocolo>1?"s":""} do WhatsApp sem protocolo registrado.`);
  return "<ul>"+it.map(i=>"<li>"+i+"</li>").join("")+"</ul>";
}

/* ---------- PDVs ---------- */
function filteredPdvs(){
  const f=S.f.pdv, q=norm(f.q);
  return S.pdvs.filter(p=>{
    if(q && !norm([p.codigo,p.unidade,p.franqueado,p.cidade].join(" ")).includes(q)) return false;
    if(f.status && p.status!==f.status) return false;
    if(f.online){ const s=pdvState(p); if(f.online!==s) return false; }
    if(f.trava==="sem-cerv" && p.travaCervejeira) return false;
    if(f.trava==="sem-porta" && p.travaPorta) return false;
    if(f.trava==="completas" && !(p.travaCervejeira&&p.travaPorta)) return false;
    if(f.cert && certState(p)!==f.cert) return false;
    return true;
  }).sort((a,b)=>String(a.codigo).localeCompare(String(b.codigo),undefined,{numeric:true}));
}
function stPill(p){ const s=pdvState(p); return {on:'<span class="pill p-ok">Vendendo</span>',nosale:'<span class="pill p-warn">Sem vendas</span>',off:'<span class="pill p-bad">Offline</span>',impl:'<span class="pill p-idle">'+esc(STATUS_PDV[p.status]||p.status)+'</span>'}[s]; }

function readForm(id){

    else if(el.type==="number") o[el.name]=el.value===""?null:Number(el.value);

  }); return o;

function filteredCh(){
  const f=S.f.ch,q=norm(f.q);
  return S.chamados.filter(c=>{
    if(f.status==="abertos"&&c.status==="resolvido") return false;
    if(f.status&&f.status!=="abertos"&&c.status!==f.status) return false;

async function saveCh(force){
  const d=readForm("chForm"); if(!d.titulo){ $("#formMsg").textContent="Descreva o que aconteceu."; return; }
  const id=d.id||uid(); delete d.id; const old=S.chamados.find(c=>c.id===id); const t=now().toISOString();
  if(d.status==="resolvido" && (d.prioridade==="critica"||d.prioridade==="alta") && !d.validadoFranqueado && !force){
    $("#formMsg").innerHTML='P1 e P2 só fecham com validação. Marque “Franqueado confirmou”, use “Aguardando validação” ou <button class="btn small" data-act="save-ch-force">encerrar mesmo assim</button>'; return; }
  if(old&&old.status==="resolvido"&&d.status!=="resolvido"){ d.reaberturas=(old.reaberturas||0)+1; d.resolvidoEm=null; }
  if(d.status!=="aberto"&&!d.primeiraRespostaEm&&d.status!=="andamento") d.primeiraRespostaEm=t;
  if(["contorno","validacao","resolvido"].includes(d.status)&&!d.contornoEm) d.contornoEm=t;
  if(d.status==="resolvido"&&!d.resolvidoEm) d.resolvidoEm=t;
  if(d.status!=="resolvido") d.resolvidoEm=null;
  if(d.status==="resolvido") d.proximoRetorno=null;
  d.atualizadoEm=t; d.demo=old?!!old.demo:false; delete d.responsavel;
  await safeWrite(()=>S.db.collection("chamados").doc(id).set(Object.assign({},old?stripId(old):{},d,{responsavel:null})),"Chamado salvo");
  closeAll();
}

/* ---------- FORNECEDORES ---------- */
function fornScore(nome){
  const ch=S.chamados.filter(c=>c.fornecedor===nome), A=ch.filter(c=>c.status!=="resolvido"), c30=ch.filter(c=>hoursSince(c.abertoEm)<24*30);
  const res=c30.filter(c=>c.resolvidoEm), fr=c30.filter(c=>c.primeiraRespostaEm);
  const avg=(arr,k)=>arr.length? arr.reduce((s,c)=>s+(new Date(c[k])-new Date(c.abertoEm))/36e5,0)/arr.length : null;
  const recIds=new Set(); recorrencias(now(),30).forEach(r=>r.ultimos.forEach(c=>recIds.add(c.id)));
  const probs=S.problemas.filter(p=>p.fornecedor===nome&&p.status!=="resolvido");
  return {abertos:A.length, encerrados30:res.length, criticos:A.filter(c=>c.prioridade==="critica").length, aguardando:A.filter(c=>c.status==="fornecedor").length,
    vencidas:A.filter(c=>c.proximoRetorno&&new Date(c.proximoRetorno)<now()).length, primResp:avg(fr,"primeiraRespostaEm"), solucao:avg(res,"resolvidoEm"),
    reincid:c30.length?Math.round(c30.filter(c=>recIds.has(c.id)||c.problemaId).length/c30.length*100):0, reabertos:c30.filter(c=>c.reaberturas).length,
    semCausa:probs.filter(p=>!String(p.causaRaiz||"").trim()).length, probs:probs.length, total30:c30.length};
}

/* ---------- RELATÓRIO DE SEGUNDA ---------- */
function semanaRange(){
  if(!S.semanaIni){ const d=now(); const day=(d.getDay()+6)%7; const mon=new Date(d.getFullYear(),d.getMonth(),d.getDate()-day-7); S.semanaIni=isoDay(mon); }
  const ini=new Date(S.semanaIni+"T00:00:00"), fim=new Date(ini.getTime()+7*864e5-1);
  return [ini,fim];
}
function semanaData(off){
  let [ini,fim]=semanaRange(); if(off){ ini=new Date(ini-7*864e5); fim=new Date(fim-7*864e5); }
  const ch=S.chamados.filter(c=>{const d=new Date(c.abertoEm); return d>=ini&&d<=fim;});
  const crit=ch.filter(c=>c.prioridade==="critica"||CRITICAS.includes(c.categoria));
  const res=ch.filter(c=>c.status==="resolvido"&&c.resolvidoEm);
  const tm=res.length?res.reduce((s,c)=>s+(new Date(c.resolvidoEm)-new Date(c.abertoEm))/36e5,0)/res.length:null;
  const forn=FORNECEDORES.map(f=>{const x=ch.filter(c=>c.fornecedor===f); if(!x.length) return null; const r=x.filter(c=>c.status==="resolvido"&&c.resolvidoEm);
    return {Fornecedor:f,Total:x.length,"Críticos":x.filter(c=>c.prioridade==="critica"||CRITICAS.includes(c.categoria)).length,Resolvidos:r.length,"Em aberto":x.length-x.filter(c=>c.status==="resolvido").length,"Plantão":x.filter(c=>c.turno==="plantao").length,"Tempo médio (h)":r.length?Math.round(r.reduce((s,c)=>s+(new Date(c.resolvidoEm)-new Date(c.abertoEm))/36e5,0)/r.length):"—"};}).filter(Boolean);
  const rec=recorrencias(fim,30);
  const fb=ch.filter(c=>c.feedbackFranqueado);
  const reab=ch.filter(c=>c.reaberturas).length;
  return {ini,fim,ch,crit,res,tm,forn,rec,fb,reab};
}

    <section class="panel"><h2>Feedbacks dos franqueados</h2>
      ${w.fb.length?'<ul>'+w.fb.map(c=>`<li><b>${esc(pdvLabel(c.pdv))}</b>: ${esc(c.titulo)} <span class="muted small">(${esc(ST_CH[c.status])})</span></li>`).join("")+'</ul>':'<p class="muted">Nenhum feedback marcado nesta semana. Marque “Feedback recorrente do franqueado” ao registrar o chamado.</p>'}</section>

function mapHeaders(headers,map){ const res={}; headers.forEach(h=>{const n=norm(h).replace(/[_.:]/g," ").replace(/\s+/g," "); for(const [k,syn] of Object.entries(map)){ if(res[k]) continue; if(syn.includes(n)){res[k]=h;break;} } });
  headers.forEach(h=>{const n=norm(h); for(const [k,syn] of Object.entries(map)){ if(res[k]) continue; if(syn.some(s=>s.length>3&&n.includes(s))) res[k]=h; }}); return res; }
function parseDate(v){
  if(v==null||v==="") return null;
  if(v instanceof Date) return isNaN(v)?null:v.toISOString();
  if(typeof v==="number"){ const d=new Date(Math.round((v-25569)*864e5)); return isNaN(d)?null:new Date(d.getTime()+d.getTimezoneOffset()*6e4).toISOString(); }
  const s=String(v).trim(); let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})(?:[ T](\d{1,2}):(\d{2}))?/);
  if(m){ const y=m[3].length===2?2000+Number(m[3]):Number(m[3]); return new Date(y,Number(m[2])-1,Number(m[1]),Number(m[4]||0),Number(m[5]||0)).toISOString(); }
  const d=new Date(s); return isNaN(d)?null:d.toISOString();
}

  if(/certificado|nfc|nota fiscal|sefaz/.test(n)) return "Certificado digital"; if(/pos\b|maquin|pagamento|cartao|pix|tef/.test(n)) return "Pagamento/POS";
  if(/camera|audit|imagem/.test(n)) return "Câmeras/Audit"; if(/totem|roteador|switch|equip|impressora|balanca/.test(n)) return "Equipamento/Infra"; return "Outro"; }
function inferStatus(v){ const n=norm(v); if(/fech|resol|conclu|encerr|finaliz/.test(n)) return "resolvido"; if(/andamento|atendimento|em analise|tratativa/.test(n)) return "andamento"; if(/aguard|pendente fornec|terceiro/.test(n)) return "fornecedor"; return "aberto"; }
function inferPrio(v,cat){ const n=norm(v); if(/crit|urg|1|emerg/.test(n)) return "critica"; if(/alt|2/.test(n)) return "alta"; if(/baix|4/.test(n)) return "baixa"; if(/med|3|normal/.test(n)) return "media"; return CRITICAS.includes(cat)?"critica":"media"; }
function matchPdv(v){ if(!v) return ""; const s=String(v).trim(); const p=S.pdvs.find(p=>String(p.codigo)===s)||S.pdvs.find(p=>norm(p.unidade)===norm(s))||S.pdvs.find(p=>norm(s).includes(norm(p.unidade))&&p.unidade); return p?p.codigo:s; }

function startImport(kind){ S.importCtx={kind}; const fi=$("#fileInput"); fi.value=""; fi.click(); }
$("#fileInput").addEventListener("change",e=>{
  const file=e.target.files[0]; if(!file||!window.XLSX) return;
  const r=new FileReader(); r.onload=()=>{
    try{ const wb=XLSX.read(r.result,{type:"array",cellDates:true}); const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{defval:"",raw:true}); if(!rows.length){ toast("A planilha está vazia."); return; }
      const headers=Object.keys(rows[0]); S.importCtx.rows=rows; S.importCtx.file=file.name;
      S.importCtx.map=mapHeaders(headers,S.importCtx.kind==="pdvs"?MAP_PDV:MAP_CH); importPreview(headers);
    }catch(err){ toast("Não consegui ler o arquivo. Use .xlsx ou .csv."); }
  }; r.readAsArrayBuffer(file);
});
function importPreview(headers){
  const ctx=S.importCtx, map=ctx.kind==="pdvs"?MAP_PDV:MAP_CH;
  const labels=ctx.kind==="pdvs"?{codigo:"Código*",unidade:"Unidade",franqueado:"Franqueado",cidade:"Cidade",uf:"UF",status:"Status contrato",online:"Online",ultimoPing:"Último sinal",ultimaVenda:"Última venda",travaCervejeira:"Trava cervejeira",travaPorta:"Trava porta",certValidade:"Validade certificado",adquirente:"Adquirente",posQtd:"POS comodato",facialOk:"Facial",appOk:"App",auditOk:"Câmeras",obs:"Observações"}
   :{titulo:"Descrição*",protocolo:"Protocolo",pdv:"PDV/unidade",abertoEm:"Data de abertura",resolvidoEm:"Data de fechamento",status:"Status",prioridade:"Prioridade",categoria:"Tipo",turno:"Turno",responsavel:"Responsável",obs:"Observações"};
  const sel=k=>`<select data-map="${k}"><option value="">Não importar</option>${headers.map(h=>`<option${ctx.map[k]===h?" selected":""}>${esc(h)}</option>`).join("")}</select>`;
  openModal(`<h2>Importar ${ctx.kind==="pdvs"?"PDVs":"chamados"}</h2><p class="muted small">${esc(ctx.file)}: ${ctx.rows.length} linhas. Confira de qual coluna vem cada campo.</p>
  ${ctx.kind==="ch"?`<div class="form" style="margin-bottom:12px"><label class="field">Fornecedor da planilha<select id="impForn">${FORNECEDORES.map(f=>`<option>${f}</option>`).join("")}</select></label><label class="field">Canal<select id="impOrig">${ORIGENS.map(o=>`<option${o==="Planilha fornecedor"?" selected":""}>${o}</option>`).join("")}</select></label></div>`:""}
  <div class="form">${Object.keys(map).map(k=>`<label class="field">${labels[k]}${sel(k)}</label>`).join("")}</div>
  <p class="small muted" style="margin-top:10px">${ctx.kind==="ch"?"Chamados com o mesmo protocolo e fornecedor são atualizados, não duplicados. Sem tipo informado, o tipo é deduzido pela descrição.":"PDVs com o mesmo código são atualizados."}</p>
  <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" data-act="close">Cancelar</button><button class="btn primary" data-act="do-import">Importar ${ctx.rows.length} linhas</button></div><p class="small muted" id="formMsg"></p>`);
}
async function doImport(){
  const ctx=S.importCtx; document.querySelectorAll("[data-map]").forEach(s=>ctx.map[s.dataset.map]=s.value);
  const g=(r,k)=>ctx.map[k]?r[ctx.map[k]]:""; const docs=[];
  if(ctx.kind==="pdvs"){
    if(!ctx.map.codigo){ $("#formMsg").textContent="Escolha a coluna do código."; return; }
    ctx.rows.forEach(r=>{ const codigo=String(g(r,"codigo")).trim(); if(!codigo) return; const old=pdvByCode(codigo);
      const st=norm(g(r,"status")); const status=/implant/.test(st)?"implantacao":/repass/.test(st)?"repasse":/distrat/.test(st)?"distrato":/cancel/.test(st)?"cancelado":(st?"ativo":(old?old.status:"ativo"));
      const d=Object.assign({},old?stripId(old):{}, {codigo,status,demo:false,atualizadoEm:now().toISOString()});
      ["unidade","franqueado","cidade","adquirente","obs"].forEach(k=>{ if(ctx.map[k]&&g(r,k)!=="") d[k]=String(g(r,k)).trim(); });
      if(ctx.map.uf&&g(r,"uf")) d.uf=String(g(r,"uf")).trim().toUpperCase().slice(0,2);
      ["online","travaCervejeira","travaPorta","facialOk","appOk","auditOk"].forEach(k=>{ if(ctx.map[k]&&g(r,k)!=="") d[k]=truthy(g(r,k)); });
      ["ultimoPing","ultimaVenda"].forEach(k=>{ if(ctx.map[k]){ const v=parseDate(g(r,k)); if(v) d[k]=v; } });
      if(ctx.map.certValidade){ const v=parseDate(g(r,"certValidade")); if(v) d.certValidade=v.slice(0,10); }
      if(ctx.map.posQtd&&g(r,"posQtd")!=="") d.posQtd=Number(g(r,"posQtd"))||0;
      docs.push(["pdvs",slug(codigo),d]); });
  } else {
    if(!ctx.map.titulo){ $("#formMsg").textContent="Escolha a coluna da descrição."; return; }
    const forn=$("#impForn").value, orig=$("#impOrig").value;
    ctx.rows.forEach(r=>{ const titulo=String(g(r,"titulo")).trim(); if(!titulo) return;
      const protocolo=String(g(r,"protocolo")||"").trim(); const id=protocolo? slug(forn+"-"+protocolo) : uid();
      const old=S.chamados.find(c=>c.id===id); const categoria=ctx.map.categoria&&g(r,"categoria")? (CATEGORIAS.find(c=>norm(c)===norm(g(r,"categoria")))||inferCat(g(r,"categoria")+" "+titulo)) : inferCat(titulo);
      const tn=norm(g(r,"turno"));
      const d=Object.assign({},old?stripId(old):{}, {titulo,protocolo,fornecedor:forn,origem:orig,categoria,pdv:matchPdv(g(r,"pdv")),
        prioridade:inferPrio(g(r,"prioridade"),categoria),status:ctx.map.status?inferStatus(g(r,"status")):(old?old.status:"aberto"),
        abertoEm:parseDate(g(r,"abertoEm"))||(old&&old.abertoEm)||now().toISOString(),resolvidoEm:parseDate(g(r,"resolvidoEm"))||null,
        turno:/plant/.test(tn)?"plantao":tn?"suporte":(old?old.turno||"":""),dono:String(g(r,"responsavel")||"").trim()||(old?donoDe(old):""),obs:String(g(r,"obs")||"").trim(),
        demo:false,importadoDe:ctx.file,atualizadoEm:now().toISOString()});
      if(d.status==="resolvido"&&!d.resolvidoEm) d.resolvidoEm=d.abertoEm;
      docs.push(["chamados",id,d]); });
  }
  const btn=document.querySelector('[data-act="do-import"]'); btn.disabled=true;
  let ok=0, fail=0;
  const LOTE=500;
  for(let i=0;i<docs.length;i+=LOTE){
    $("#formMsg").textContent="Importando "+Math.min(i+LOTE,docs.length)+" de "+docs.length+"…";
    const res=await Promise.allSettled(docs.slice(i,i+LOTE).map(([c,id,d])=>S.db.collection(c).doc(id).set(d)));
    res.forEach(r=>r.status==="fulfilled"?ok++:fail++);
    if(fail&&res.some(r=>r.status==="rejected"&&r.reason&&r.reason.code==="invalid_argument")){ break; }
  }
  closeAll(); toast(ok+" registros importados"+(fail?", "+fail+" com erro":"")+".");
}

/* ---------- Claude ---------- */
async function askClaude(prompt,outId,btn){
  const out=document.getElementById(outId); out.classList.add("show"); out.textContent="Pensando…"; if(btn) btn.disabled=true;
  try{ const r=await S.sample(prompt,{modelTier:"default",onText:({text})=>{out.textContent=text;}}); out.textContent=r.text; }
  catch(e){ out.textContent = e.code==="not_granted"?"O uso do Claude não foi autorizado nesta página.": e.code==="rate_limited"?"Muitos pedidos em sequência. Tente de novo em instantes.":"Não foi possível gerar agora ("+e.code+")."; }
  finally{ if(btn) btn.disabled=false; }
}
function dadosParaIA(){

}

    case "ai-semana": askClaude("Você prepara a reunião de segunda do time de Sistemas da fast4you (mercados autônomos). Com o relatório abaixo, escreva uma pauta objetiva em português do Brasil: destaques da semana, cobranças por fornecedor (com fatos e números), problemas recorrentes que pedem causa raiz e próximos passos com responsável sugerido. Texto simples, tópicos com hífen, sem markdown, no máximo 250 palavras.\n\n"+resumoSemanaTexto(),"aiSemana",el); break;
  }
});
$("#menuBtn").addEventListener("click",()=>$("#side").classList.toggle("open"));
$("#themeBtn").addEventListener("click",()=>{ const r=document.documentElement; const dark=r.dataset.theme? r.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches; r.dataset.theme=dark?"light":"dark"; try{localStorage.setItem("f4y-theme",r.dataset.theme)}catch(_){} renderMain(); });
try{ const t=localStorage.getItem("f4y-theme"); if(t) document.documentElement.dataset.theme=t; }catch(_){}
setInterval(()=>{ if(S.ready&&!$("#modal").classList.contains("show")){ renderNav(); if(S.page==="painel") renderMain(); } },5*60*1000);

init();
})();
